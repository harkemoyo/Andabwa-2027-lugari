name: "andabwa-blog"
type: "php"
version: "8.3"

environments:
  production:
    memory: 1024
    cli-memory: 512
    cpu: 1
    
    workers:
      queue:
        command: "php artisan queue:work database --sleep=3 --tries=3"
        count: 1
        memory: 512
    
    build-commands:
      - "composer install --no-dev --optimize-autoloader"
      - "php artisan config:cache"
      - "php artisan route:cache"
      - "php artisan view:cache"
      - "npm ci --only=production"
      - "npm run build"
      - "echo 'Ensuring seed images are available for production'"
      - "ls -la public/seed-images/ || echo 'Seed images directory not found in build'"
      - "cp -r public/seed-images public/seed-images-backup || true"
    deploy-commands:
      - "php artisan migrate --force"
      # Seeding is disabled for production - data should be managed via migrations or admin panel
      # - "php artisan db:seed --force"
      # Storage symlink not needed - using S3 for all file storage
      - "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache"
      - "php artisan optimize:clear"
      - "php artisan config:clear"
      - "php artisan cache:clear"
      - "php artisan view:clear"
      - "php artisan route:clear"
      - "php artisan media-library:clear"
      - "php clear-media-cache.php"
      - "php artisan config:cache"
      - "php artisan route:cache"
      - "php artisan view:cache"
      - "php deploy-debug.php"

    mounts:
      - "/var/www/html/storage/app/public"
    
    environment:
      APP_NAME: "Dr. Isaac GM Andabwa OGW Development Activities Lugari Constituency"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: ""
      APP_URL: "${APP_URL}"
      
      # Database (Laravel Cloud provides these)
      DB_CONNECTION: "pgsql"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSLMODE: "prefer"
      
      # Cache (use database cache to avoid Redis dependency initially)
      CACHE_DRIVER: "database"
      
      # Session (use database to avoid Redis dependency initially)
      SESSION_DRIVER: "database"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      
      # Queue (use database to avoid Redis dependency initially)
      QUEUE_CONNECTION: "database"
      
      # File Storage
      FILESYSTEM_DISK: "s3"
      FILESYSTEM_CLOUD: "s3"
      
      # Mail
      MAIL_MAILER: "log"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${APP_NAME}"

      # AWS (if needed)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_URL: "${AWS_URL}"

      # WHATSAPP
      WHATSAPP_API_URL: "${WHATSAPP_API_URL}"
      WHATSAPP_API_TOKEN: "${WHATSAPP_API_TOKEN}"
      WHATSAPP_FAKE: "${WHATSAPP_FAKE}"

      # GOOGLE_MAPS_KEY
      GOOGLE_MAPS_KEY: "${GOOGLE_MAPS_KEY}"
      GOOGLE_ANALYTICS_ID: "${GOOGLE_ANALYTICS_ID}"

      GOOGLE_SITE_URL: "${GOOGLE_SITE_URL}"
      GOOGLE_SERVICE_ACCOUNT_JSON: "${GOOGLE_SERVICE_ACCOUNT_JSON}"

      # GOOGLE LOGIN
      # OPENAI CHATGPT
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_ORGANIZATION: "${OPENAI_ORGANIZATION}"
