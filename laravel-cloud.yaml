name: "andabwa-blog"
type: "php"
version: "8.3"

environments:
  production:
    memory: 1024
    cli-memory: 512
    cpu: 1
    build-commands:
      - "composer install --no-dev --optimize-autoloader"
      - "php artisan config:cache"
      - "php artisan route:cache"
      - "php artisan view:cache"
      - "npm ci --only=production"
      - "npm run build"
    deploy-commands:
      - "php artisan migrate --force"
      - "php artisan storage:link"
      - "php artisan optimize:clear"
    
    mounts:
      - "/var/www/html/storage/app/public"
    
    environment:
      APP_NAME: "Andabwa Foundation Blog"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      
      # Database (Laravel Cloud provides these)
      DB_CONNECTION: "pgsql"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      
      # Cache
      CACHE_DRIVER: "redis"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      
      # File Storage
      FILESYSTEM_DISK: "s3"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_URL: "${AWS_URL}"
      
      # Queue
      QUEUE_CONNECTION: "redis"
      
      # Session
      SESSION_DRIVER: "redis"
      
      # Mail
      MAIL_MAILER: "smtp"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"



# laravel-cloud.yml
build:
  commands:
    # 1. Install PHP dependencies
    - composer install --prefer-dist --no-dev --no-progress --no-interaction --optimize-autoloader

    # 2. Ensure storage + cache dirs exist
    - php artisan package:discover --ansi
      - php -r \"if(!is_dir('storage/framework/cache')) mkdir('storage/framework/cache', 0777, true);\""
      - php -r \"if(!is_dir('storage/framework/sessions')) mkdir('storage/framework/sessions', 0777, true);\""
      - php -r \"if(!is_dir('storage/framework/views')) mkdir('storage/framework/views', 0777, true);\""
      - php -r \"if(!is_dir('bootstrap/cache')) mkdir('bootstrap/cache', 0777, true);\""

    # 3. Run Laravel cleanup
    - php artisan storage:link
    - php artisan config:clear
    - php artisan cache:clear
    - php artisan route:clear
    - php artisan view:clear

    # 4. Rebuild caches
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan event:cache

    # 5. Build frontend (if using Vite)
    - npm ci --no-audit --no-fund
    - npm run build

release:
  commands:
    # Run migrations (safe mode)
    - php artisan fix:cache-paths
    - php artisan migrate --force




