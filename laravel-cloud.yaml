name: "andabwa-blog"
type: "php"
version: "8.3"

environments:
  production:
    memory: 1024
    cli-memory: 512
    cpu: 1
    build-commands:
      - "composer install --no-dev --optimize-autoloader"
      - "php artisan config:cache"
      - "php artisan route:cache"
      - "php artisan view:cache"
      - "npm ci --only=production"
      - "npm run build"
    deploy-commands:
      - "php artisan migrate --force"
      - "php artisan storage:link"
      - "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache"
      - "chmod -R 775 storage bootstrap/cache"
      - "php artisan optimize:clear"
      - "php artisan config:clear"
      - "php artisan cache:clear"
      - "php artisan view:clear"
      - "php artisan route:clear"
    
    mounts:
      - "/var/www/html/storage/app/public"
    
    environment:
      APP_NAME: "Dr. Isaac GM Andabwa OGW Development Activities Lugari Constituency"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "base64:l2inKutMsVCE7gQzz6We3pSsSaSopwx+U+ON4dFrDnM="
      APP_URL: "${APP_URL}"
      
      # Database (Laravel Cloud provides these)
      DB_CONNECTION: "pgsql"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSLMODE: "prefer"
      
      # Cache (use database cache to avoid Redis dependency initially)
      CACHE_DRIVER: "database"
      
      # Session (use database to avoid Redis dependency initially)
      SESSION_DRIVER: "database"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      
      # Queue (use database to avoid Redis dependency initially)
      QUEUE_CONNECTION: "database"
      
      # File Storage
      FILESYSTEM_DISK: "local"
      
      # Mail
      MAIL_MAILER: "log"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${APP_NAME}"

      # AWS (if needed)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
      AWS_BUCKET: "${AWS_BUCKET}"
      AWS_URL: "${AWS_URL}"
