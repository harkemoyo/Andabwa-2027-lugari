; File Uploads
file_uploads = On
max_file_uploads = 20
upload_max_filesize = 3M
post_max_size = 4M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Upload Progress
session.upload_progress.cleanup = On
session.upload_progress.enabled = On
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 1
